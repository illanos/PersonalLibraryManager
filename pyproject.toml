[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exportador"
dynamic = ["version"]
description = "Organiza, renombra y optimiza tu biblioteca de fotos, vídeos y notas de voz, con una galería web local."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["Pillow>=11.0"]

[project.optional-dependencies]
# Fotos HEIC/HEIF del iPhone (sin él se omiten con un aviso)
heic = ["pillow-heif>=0.16"]
# Caras en la galería (galeria --caras)
caras = ["opencv-python>=4.8"]
todo = ["pillow-heif>=0.16", "opencv-python>=4.8"]

[project.scripts]
exportador = "exportador.cli:ejecutar"

[project.urls]
Repository = "https://github.com/illanos/PersonalLibraryManager"

[tool.setuptools.dynamic]
version = { attr = "exportador.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exportador = ["plantillas/*.html"]
